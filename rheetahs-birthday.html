<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rheetah's Kitchen, Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     RHEETAH'S KITCHEN, BIRTHDAY OVERLAY  (refined)
     No emoji. No sound. Fits the viewport. Triggers July 10.
     Set RK_FORCE_PREVIEW to false for production.

     PHOTOS: the <img class="rk-slide"> list below is the montage.
     In the Astro build, replace that list with your birthday/photos/
     folder. Keep everything else. Portraits of Rita and the team,
     not dishes.
     ============================================================ */
  :root{
    --gold:#C7A15A; --gold-lite:#E6CB88; --cream:#F3EBD9; --muted:#C7B892;
    --espresso:#2A1607;
  }
  #rk-bday *{margin:0;padding:0;box-sizing:border-box}
  #rk-bday{
    position:fixed; inset:0; z-index:999999; display:none;
    font-family:'Inter',system-ui,sans-serif; color:var(--cream);
    opacity:0; transition:opacity .7s ease; overflow-y:auto;
    background:radial-gradient(125% 100% at 50% 16%, #37200E 0%, #1A0E05 46%, #0A0602 100%);
  }
  #rk-bday.rk-show{display:flex; opacity:1}
  #rk-bday.rk-closing{opacity:0}

  /* faint gold vignette + warm floor glow */
  #rk-bday .rk-glow{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 40% at 50% 108%, rgba(199,161,90,.16), transparent 60%),
      radial-gradient(80% 70% at 50% 40%, transparent 62%, rgba(0,0,0,.45) 100%)}

  /* continuous floating balloons, CSS only, behind the content */
  #rk-bday .rk-balloons{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  #rk-bday .rk-balloon{position:absolute;bottom:-20vh;left:0;will-change:transform}
  #rk-bday .rk-balloon__b{position:relative;
    width:var(--bw,44px);height:calc(var(--bw,44px)*1.22);
    border-radius:50% 50% 49% 49% / 46% 46% 54% 54%;
    background:radial-gradient(38% 30% at 34% 26%, rgba(255,255,255,.55), rgba(255,255,255,0) 62%), var(--bc,#C7A15A);
    box-shadow:inset -6px -9px 15px rgba(0,0,0,.30), inset 5px 5px 11px rgba(255,255,255,.10), 0 10px 22px rgba(0,0,0,.28);
    animation:rk-sway var(--sway,6s) ease-in-out infinite alternate}
  #rk-bday .rk-balloon__b::after{content:"";position:absolute;left:50%;bottom:-6px;
    transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;
    border-top:8px solid var(--bc,#C7A15A);opacity:.9}
  #rk-bday .rk-balloon__s{position:absolute;top:100%;left:50%;width:13px;height:30px;margin-top:5px;
    border-left:1.5px solid rgba(230,203,136,.45);border-bottom-left-radius:13px;transform:translateX(-50%)}
  @keyframes rk-float{from{transform:translateY(0)}to{transform:translateY(-135vh)}}
  @keyframes rk-sway{from{transform:translateX(-11px) rotate(-3.5deg)}to{transform:translateX(11px) rotate(3.5deg)}}

  /* stage */
  #rk-bday .rk-stage{position:relative;z-index:5;margin:auto;
    width:min(540px,100%);padding:48px 26px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:18px;
    animation:rk-in 1s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rk-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  #rk-bday .rk-logo{height:38px;width:auto;opacity:.92;
    filter:brightness(0) saturate(100%) invert(78%) sepia(28%) saturate(560%) hue-rotate(357deg) brightness(92%) contrast(88%)}
  #rk-bday .rk-eyebrow{font-size:11.5px;letter-spacing:.34em;font-weight:600;
    color:var(--gold);text-transform:uppercase}

  /* portrait frame */
  #rk-bday .rk-frame{position:relative;height:min(46dvh,440px);aspect-ratio:4/5;
    border-radius:14px;overflow:hidden;background:#20130a;
    border:1px solid rgba(230,203,136,.55);
    box-shadow:0 22px 60px rgba(0,0,0,.55), 0 0 0 6px rgba(199,161,90,.08),
               inset 0 0 40px rgba(0,0,0,.35)}
  #rk-bday .rk-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity 1.4s ease}
  #rk-bday .rk-slide.rk-on{opacity:1;animation:rk-ken 7s ease-out forwards}
  @keyframes rk-ken{from{transform:scale(1.09)}to{transform:scale(1)}}
  #rk-bday .rk-frame::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top, rgba(10,6,2,.4), transparent 44%)}

  #rk-bday .rk-title{font-family:'Fraunces',serif;line-height:1.04;margin-top:2px}
  #rk-bday .rk-title .l1{display:block;font-style:italic;font-weight:400;
    font-size:clamp(22px,4.8vw,30px);color:var(--muted)}
  #rk-bday .rk-title .l2{display:block;font-weight:600;
    font-size:clamp(34px,8vw,54px);color:var(--cream);letter-spacing:-.01em}
  #rk-bday .rk-sub{font-size:14.5px;color:var(--muted);letter-spacing:.01em}

  #rk-bday .rk-actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px}
  #rk-bday .rk-cta{font-family:'Inter';font-size:14.5px;font-weight:600;letter-spacing:.02em;
    padding:13px 26px;border-radius:999px;cursor:pointer;text-decoration:none;
    color:#241405;background:linear-gradient(180deg,var(--gold-lite),var(--gold));
    box-shadow:0 10px 26px rgba(199,161,90,.30);border:none;
    display:inline-flex;align-items:center;gap:9px;transition:transform .15s ease,box-shadow .2s}
  #rk-bday .rk-cta:hover{transform:translateY(-1px);box-shadow:0 14px 32px rgba(199,161,90,.42)}
  #rk-bday .rk-cta:active{transform:translateY(0)}
  #rk-bday .rk-enter{background:none;border:none;cursor:pointer;color:var(--muted);
    font-family:'Inter';font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 8px;transition:color .2s}
  #rk-bday .rk-enter:hover{color:var(--cream)}

  #rk-bday .rk-close{position:fixed;top:18px;right:20px;z-index:8;width:40px;height:40px;
    border-radius:50%;border:1px solid rgba(230,203,136,.3);background:rgba(20,12,5,.5);
    color:var(--cream);font-size:19px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:background .2s,border-color .2s}
  #rk-bday .rk-close:hover{background:rgba(20,12,5,.85);border-color:rgba(230,203,136,.6)}

  @media (max-width:520px){
    #rk-bday .rk-stage{padding:40px 20px;gap:15px}
    #rk-bday .rk-frame{height:min(42dvh,360px)}
  }
  @media (prefers-reduced-motion:reduce){
    #rk-bday .rk-balloon__b{animation-duration:16s}
    #rk-bday .rk-slide.rk-on{animation:none}
    #rk-bday .rk-stage{animation:none}
  }
</style>
</head>

      <span class="l1">Happy birthday,</span>
      <span class="l2">Chef Rheetah</span>
    </div>
    <p class="rk-sub">Another year of love at first bite.</p>

    <div class="rk-actions">
      <a class="rk-cta" href="https://wa.me/2349129508724?text=Happy%20Birthday%20Chef%20Rheetah%21" target="_blank" rel="noopener">Send birthday wishes &rarr;</a>
      <button class="rk-enter" id="rk-enter">Enter site</button>
    </div>

</div>

<script>
(function(){
  // ---- CONFIG -------------------------------------------------
  var RK_FORCE_PREVIEW = false;  // set FALSE for production
  var BDAY_MONTH = 6, BDAY_DATE = 10;   // July 10 (month is 0 indexed)
  // -------------------------------------------------------------
  var d = new Date();
  var force = RK_FORCE_PREVIEW || location.search.indexOf('bday=1') !== -1;
  var isBday = d.getMonth()===BDAY_MONTH && d.getDate()===BDAY_DATE;
  if(!(force || isBday)) return;
  // Production: if(sessionStorage.getItem('rk_bday_seen')) return;

  var root = document.getElementById('rk-bday');
  root.classList.add('rk-show');

  function close(){
    root.classList.add('rk-closing');
    setTimeout(function(){ root.classList.remove('rk-show','rk-closing'); }, 700);
    // Production: sessionStorage.setItem('rk_bday_seen','1');
  }
  document.getElementById('rk-close').addEventListener('click', close);
  document.getElementById('rk-enter').addEventListener('click', close);
  addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });

  // continuous floating balloons: respawn each at a new spot when it finishes rising
  var host = document.getElementById('rk-balloons');
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var COLORS = ['#C7A15A','#C7A15A','#C7A15A','#FFFDF8','#FFFDF8','#F27326','#F27326','#6B4A33','#41210A'];
  var COUNT = reduce ? 4 : (window.innerWidth < 560 ? 8 : 11);
  function launch(el, initial){
    var dur = (reduce ? 22 : 9) + Math.random() * (reduce ? 10 : 7);
    el.style.left = (Math.random()*100) + '%';
    el.style.setProperty('--bw', (30 + Math.random()*30) + 'px');
    el.style.setProperty('--bc', COLORS[(Math.random()*COLORS.length)|0]);
    el.firstChild.style.setProperty('--sway', (4 + Math.random()*4) + 's');
    var delay = initial ? (-Math.random()*dur) : 0;
    el.style.animation = 'none'; void el.offsetWidth;
    el.style.animation = 'rk-float ' + dur + 's linear ' + delay + 's forwards';
  }
  for(var i=0;i<COUNT;i++){
    var b = document.createElement('div'); b.className = 'rk-balloon';
    b.innerHTML = '<div class="rk-balloon__b"><span class="rk-balloon__s"></span></div>';
    b.addEventListener('animationend', function(e){ if(e.animationName === 'rk-float') launch(this, false); });
    host.appendChild(b);
    launch(b, true);
  }

  // montage crossfade
  var slides = root.querySelectorAll('.rk-slide'), idx=0;
  if(slides.length > 1){
    setInterval(function(){
      slides[idx].classList.remove('rk-on');
      idx=(idx+1)%slides.length;
      slides[idx].classList.add('rk-on');
    }, 3200);
  }
})();
</script>
